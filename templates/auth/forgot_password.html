<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Pansol Resorts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/page_experience.css') }}">
    <style>body{background:#f3f6f4}.container{max-width:620px;min-height:0}.right{flex:1;padding:clamp(24px,6vw,48px)}</style>
</head>
<body>
<main class="container">
    <section class="right">
        <div class="login-box">
            <h1>Forgot Password?</h1>
            <p class="subtitle">Enter the email address linked to your account. We’ll send you a secure reset link.</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="post" action="{{ url_for('forgot_password') }}">
                <label for="email">Email Address</label>
                <input id="email" type="email" name="email" autocomplete="email" required>
                <button class="login-btn" type="submit">Send reset link</button>
                <div class="register"><a href="{{ url_for('login') }}">Back to Log In</a></div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
