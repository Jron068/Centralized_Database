<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password | Pansol Resorts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/page_experience.css') }}">
    <style>body{background:#f3f6f4}.container{max-width:620px;min-height:0}.right{flex:1;padding:clamp(24px,6vw,48px)}</style>
</head>
<body>
<main class="container">
    <section class="right">
        <div class="login-box">
            <h1>Choose a New Password</h1>
            <p class="subtitle">Use at least 8 characters. This reset link can only be used once.</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="post" action="{{ url_for('reset_password', token=token) }}">
                <label for="password">New Password</label>
                <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
                <label for="confirm_password">Confirm New Password</label>
                <input id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
                <button class="login-btn" type="submit">Update Password</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
