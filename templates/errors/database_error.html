<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Database connection problem</title>
    <style>
        body { margin: 0; padding: 2rem; background: #f2f5f3; color: #243127; font: 16px Arial, sans-serif; }
        main { max-width: 620px; margin: 10vh auto; padding: 2rem; background: white; border-radius: 12px; }
        h1 { color: #276d34; }
        a { color: #276d34; }
    </style>
</head>
<body>
    <main>
        <h1>Database connection problem</h1>
        <p>The website could not connect to its database, so this page cannot load right now.</p>
        <p>Check that MySQL is running and that <code>DB_HOST</code>, <code>DB_PORT</code>,
           <code>DB_USER</code>, <code>DB_PASSWORD</code>, and <code>DB_NAME</code> in your local
           <code>.env</code> match your MySQL setup. Then restart Flask.</p>
        <p><a href="/">Try the home page again</a></p>
    </main>
</body>
</html>
