services:
  - type: web
    name: centralized-database-resort
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_SERVICE_ROLE_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODERATION_MODEL
        value: omni-moderation-latest
